<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B0E14">
<title>Code Sauce</title>
<style>
  @font-face { font-family: 'Nunito'; font-weight: 400; font-display: swap; src: url('fonts/nunito-400-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 700; font-display: swap; src: url('fonts/nunito-700-latin.woff2') format('woff2'); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0B0E14; }
  body {
    min-height: 100dvh; display: grid; place-items: center; text-align: center; padding: 24px;
    color: white; font-family: 'Nunito', Arial, sans-serif;
    background: radial-gradient(60% 45% at 50% 0%, rgba(0, 230, 118, 0.13), transparent 70%),
                radial-gradient(50% 40% at 85% 100%, rgba(179, 136, 255, 0.08), transparent 70%), #0B0E14;
  }
  #titre { margin: 0; font-weight: 500; font-size: clamp(44px, 9vw, 84px); letter-spacing: -1px;
           animation: entree 400ms ease-out both, respiration 2.4s ease-in-out 400ms infinite; }
  @keyframes entree { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes respiration { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
  #titre.erreur { font-size: clamp(22px, 4vw, 30px); letter-spacing: 0; color: #FF5252; animation: entree 300ms ease-out both; }
  #actions { display: none; margin-top: 28px; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #actions a { min-height: 52px; padding: 0 26px; display: inline-flex; align-items: center; border-radius: 999px;
               font-weight: 700; font-size: 17px; text-decoration: none; }
  #actions a.principal { background: #00E676; color: #000; }
  #actions a.secondaire { color: #00E676; }
</style>
</head>
<body>
<main>
  <h1 id="titre">Connexion</h1>
  <div id="actions"><a class="principal" href="connexion.html">Réessayer</a><a class="secondaire" href="./">Revenir à Code Sauce</a></div>
</main>
<script>
  var CLIENT = "605004102980-ii9eeqijcis96g13uc4rrhilqiuunng1.apps.googleusercontent.com";
  var RETOUR = "https://albanleroy.github.io/code-sauce-4.0/connexion.html";
  function echec(texte) {
    var titre = document.getElementById("titre");
    titre.textContent = texte;
    titre.className = "erreur";
    document.getElementById("actions").style.display = "flex";
  }
  function versGoogle() {
    var octets = new Uint8Array(16);
    crypto.getRandomValues(octets);
    var alea = Array.prototype.map.call(octets, function (o) { return ("0" + o.toString(16)).slice(-2); }).join("");
    sessionStorage.setItem("codeSauceAlea", alea);
    var requete = new URLSearchParams({ client_id: CLIENT, redirect_uri: RETOUR, response_type: "id_token",
      scope: "openid email", nonce: alea, state: alea, prompt: "select_account" });
    location.replace("https://accounts.google.com/o/oauth2/v2/auth?" + requete);
  }
  function nonceDuJeton(jeton) {
    try { return JSON.parse(atob(jeton.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).nonce; } catch (e) { return null; }
  }
  var retour = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname); // le jeton ne reste ni dans l'historique ni à l'écran
  if (!retour.has("id_token") && !retour.has("error")) {
    versGoogle();
  } else {
    var alea = sessionStorage.getItem("codeSauceAlea");
    sessionStorage.removeItem("codeSauceAlea");
    var jeton = retour.get("id_token");
    if (retour.has("error")) {
      echec(retour.get("error") === "access_denied" ? "Connexion annulée." : "Google a refusé la connexion (" + retour.get("error") + ").");
    } else if (!alea || retour.get("state") !== alea || nonceDuJeton(jeton) !== alea) {
      echec("Cette connexion n'a pas été demandée depuis cette page. Recommence.");
    } else {
      fetch("/code-sauce-4.0/adresse.txt?" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (adresse) {
          adresse = adresse.trim();
          if (!adresse) { echec("Code Sauce est fermé pour le moment, reviens plus tard."); return; }
          location.replace(adresse + "/#google=" + encodeURIComponent(jeton));
        }, function () { echec("Impossible de joindre Code Sauce. Réessaie."); });
    }
  }
</script>
</body>
</html>
