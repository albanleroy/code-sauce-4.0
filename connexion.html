<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Code Sauce — connexion</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0B0E14; color: #e8e8f0;
         font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 0 16px; }
  h1 { color: #00E676; font-size: 24px; margin: 0 0 8px; }
  p { color: #A0AEC0; font-size: 15px; margin: 0 0 24px; }
  a { display: inline-block; margin: 0 6px; padding: 12px 18px; border-radius: 12px; font-weight: 700; text-decoration: none; }
  a.principal { background: #00E676; color: #000; }
  a.secondaire { color: #A0AEC0; border: 1px solid #1F293D; }
  #actions { display: none; }
</style>
</head>
<body>
<main>
  <h1>Code Sauce</h1>
  <p id="message">Connexion…</p>
  <div id="actions"><a class="principal" href="connexion.html">Réessayer</a><a class="secondaire" id="revenir" href="./">Revenir à Code Sauce</a></div>
</main>
<script>
  var CLIENT = "605004102980-ii9eeqijcis96g13uc4rrhilqiuunng1.apps.googleusercontent.com";
  var RETOUR = "https://albanleroy.github.io/code-sauce-4.0/connexion.html";
  function echec(texte) {
    document.getElementById("message").textContent = texte;
    document.getElementById("actions").style.display = "block";
  }
  function versGoogle() {
    var octets = new Uint8Array(16);
    crypto.getRandomValues(octets);
    var alea = Array.prototype.map.call(octets, function (o) { return ("0" + o.toString(16)).slice(-2); }).join("");
    sessionStorage.setItem("codeSauceAlea", alea);
    var requete = new URLSearchParams({ client_id: CLIENT, redirect_uri: RETOUR, response_type: "id_token",
      scope: "openid email", nonce: alea, state: alea, prompt: "select_account" });
    location.replace("https://accounts.google.com/o/oauth2/v2/auth?" + requete);
  }
  function nonceDuJeton(jeton) {
    try { return JSON.parse(atob(jeton.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).nonce; } catch (e) { return null; }
  }
  var retour = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname); // le jeton ne reste ni dans l'historique ni à l'écran
  if (!retour.has("id_token") && !retour.has("error")) {
    versGoogle();
  } else {
    var alea = sessionStorage.getItem("codeSauceAlea");
    sessionStorage.removeItem("codeSauceAlea");
    var jeton = retour.get("id_token");
    if (retour.has("error")) {
      echec(retour.get("error") === "access_denied" ? "Connexion annulée." : "Google a refusé la connexion (" + retour.get("error") + ").");
    } else if (!alea || retour.get("state") !== alea || nonceDuJeton(jeton) !== alea) {
      echec("Cette connexion n'a pas été demandée depuis cette page. Recommence.");
    } else {
      fetch("/code-sauce-4.0/adresse.txt?" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (adresse) {
          adresse = adresse.trim();
          if (!adresse) { echec("Code Sauce est fermé pour le moment, reviens plus tard."); return; }
          location.replace(adresse + "/#google=" + encodeURIComponent(jeton));
        }, function () { echec("Impossible de joindre Code Sauce. Réessaie."); });
    }
  }
</script>
</body>
</html>
