<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B0E14">
<title>Code Sauce</title>
<style>
  @font-face { font-family: 'Montserrat'; font-weight: 900; font-display: swap; src: url('fonts/montserrat-900-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 400; font-display: swap; src: url('fonts/nunito-400-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Nunito'; font-weight: 700; font-display: swap; src: url('fonts/nunito-700-latin.woff2') format('woff2'); }
  :root { --fond-principal: #0B0E14; --fond-secondaire: #111622; --texte-blanc: white; --texte-gris-clair: #A0AEC0;
          --vert: #00E676; --jaune: #FFC107; --rouge: #FF5252; --police: 'Nunito', Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fond-principal); }
  .connexion {
    position: relative; min-height: 100dvh; box-sizing: border-box; display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); color: var(--texte-blanc); font-family: var(--police);
    background: radial-gradient(60% 45% at 50% 0%, rgba(0, 230, 118, 0.13), transparent 70%),
                radial-gradient(50% 40% at 85% 100%, rgba(179, 136, 255, 0.08), transparent 70%), var(--fond-principal);
  }
  .connexion-carte { position: relative; width: min(1040px, 100%); box-sizing: border-box; overflow: hidden; border-radius: 18px;
    padding: 48px 48px 44px; background: var(--fond-secondaire); box-shadow: 0 24px 70px rgba(0, 0, 0, 0.4); }
  .connexion-logo { font-family: 'Montserrat', Arial, sans-serif; font-weight: 900; font-size: 24px; color: var(--vert); white-space: nowrap; margin-bottom: 28px; }
  .connexion-volet { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; column-gap: 56px; min-height: 380px; }
  .connexion-titre { font-weight: 500; font-size: 52px; line-height: 1.12; letter-spacing: -0.5px; margin: 0 0 20px; }
  .connexion-texte { color: var(--texte-gris-clair); font-size: 19px; line-height: 1.55; margin: 0; }
  .connexion-droite { display: flex; flex-direction: column; padding-top: 6px; }
  .connexion-actions { grid-column: 1 / -1; padding-top: 32px; display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
  .connexion-pilule { min-height: 52px; padding: 0 28px; display: inline-flex; align-items: center; justify-content: center; border-radius: 999px;
    font: 700 17px var(--police); cursor: pointer; border: none; background: #fff; color: #1f1f1f; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.3); }
  .connexion-texte-bouton { min-height: 52px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    border-radius: 999px; color: var(--jaune); font: 700 17px var(--police); text-decoration: none; white-space: nowrap; }
  @media (hover: hover) { .connexion-pilule:hover { filter: brightness(0.95); } .connexion-texte-bouton:hover { background: rgba(255, 193, 7, 0.1); } }
  .connexion-etapes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 24px; }
  .connexion-etapes li { display: flex; align-items: center; gap: 16px; font-size: 19px; line-height: 1.4; }
  .connexion-etapes li > span { flex: none; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-weight: 800;
    font-size: 16px; color: var(--vert); background: rgba(0, 230, 118, 0.12); border: 1px solid rgba(0, 230, 118, 0.3); }
  .connexion-erreur { display: none; align-items: flex-start; gap: 8px; margin: 0 0 18px; color: var(--rouge); font-size: 16px; font-weight: 600; line-height: 1.4; }
  .connexion-erreur svg { flex: none; margin-top: 1px; }
  @media (max-width: 840px) {
    .connexion { padding: max(76px, calc(env(safe-area-inset-top) + 60px)) 8px max(24px, env(safe-area-inset-bottom)); }
    .connexion-carte { position: static; background: transparent; box-shadow: none; border-radius: 0; padding: 0 16px; }
    .connexion-logo { position: absolute; top: max(24px, calc(env(safe-area-inset-top) + 12px)); left: 24px; margin: 0; font-size: 21px; }
    .connexion-volet { grid-template-columns: 1fr; min-height: 0; grid-template-rows: none; align-content: center; }
    .connexion-titre { font-size: 34px; margin-bottom: 12px; }
    .connexion-texte { font-size: 16px; }
    .connexion-etapes { gap: 18px; }
    .connexion-etapes li { font-size: 16px; gap: 14px; }
    .connexion-etapes li > span { width: 32px; height: 32px; font-size: 14px; }
    .connexion-pilule, .connexion-texte-bouton { font-size: 16px; }
    .connexion-gauche { margin-bottom: 32px; }
    .connexion-actions { flex-direction: column; align-items: stretch; gap: 6px; }
  }
</style>
</head>
<body>
<div class="connexion">
  <div class="connexion-carte">
    <div class="connexion-logo">| Code Sauce |</div>
    <div class="connexion-volet">
      <div class="connexion-gauche">
        <h1 class="connexion-titre">Connexion</h1>
        <p class="connexion-texte">Code Sauce est réservé aux joueurs invités. Chaque nouvel appareil est autorisé par l'administrateur.</p>
      </div>
      <div class="connexion-droite">
        <div class="connexion-erreur" id="erreur" role="alert"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12" y2="17"/></svg><span id="message"></span></div>
        <ol class="connexion-etapes">
          <li><span>1</span>Connecte-toi avec ton compte Google</li>
          <li><span>2</span>L'administrateur autorise cet appareil</li>
          <li><span>3</span>Tu entres, et cet appareil ne le redemandera plus</li>
        </ol>
      </div>
      <div class="connexion-actions">
          <button type="button" class="connexion-pilule" id="connexion">Connexion</button>
          <a class="connexion-texte-bouton" href="./"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="5.5"/><path d="M21 2l-9.6 9.6M15.5 7.5 19 4M18 9l3-3"/></svg> Connexion de secours</a>
      </div>
    </div>
  </div>
</div>
<script>
  var CLIENT = "605004102980-ii9eeqijcis96g13uc4rrhilqiuunng1.apps.googleusercontent.com";
  var RETOUR = "https://albanleroy.github.io/code-sauce-4.0/connexion.html";
  function echec(texte) {
    document.getElementById("message").textContent = texte;
    document.getElementById("erreur").style.display = "flex";
  }
  function versGoogle() {
    var octets = new Uint8Array(16);
    crypto.getRandomValues(octets);
    var alea = Array.prototype.map.call(octets, function (o) { return ("0" + o.toString(16)).slice(-2); }).join("");
    sessionStorage.setItem("codeSauceAlea", alea);
    var requete = new URLSearchParams({ client_id: CLIENT, redirect_uri: RETOUR, response_type: "id_token",
      scope: "openid email", nonce: alea, state: alea, prompt: "select_account" });
    location.replace("https://accounts.google.com/o/oauth2/v2/auth?" + requete);
  }
  function nonceDuJeton(jeton) {
    try { return JSON.parse(atob(jeton.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).nonce; } catch (e) { return null; }
  }
  document.getElementById("connexion").addEventListener("click", versGoogle);
  var retour = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, "", location.pathname); // le jeton ne reste ni dans l'historique ni à l'écran
  if (!retour.has("id_token") && !retour.has("error")) {
    versGoogle();
  } else {
    var alea = sessionStorage.getItem("codeSauceAlea");
    sessionStorage.removeItem("codeSauceAlea");
    var jeton = retour.get("id_token");
    if (retour.has("error")) {
      echec(retour.get("error") === "access_denied" ? "Connexion annulée." : "Google a refusé la connexion (" + retour.get("error") + ").");
    } else if (!alea || retour.get("state") !== alea || nonceDuJeton(jeton) !== alea) {
      echec("Cette connexion n'a pas été demandée depuis cette page. Recommence.");
    } else {
      fetch("/code-sauce-4.0/adresse.txt?" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (adresse) {
          adresse = adresse.trim();
          if (!adresse) { echec("Code Sauce est fermé pour le moment, reviens plus tard."); return; }
          location.replace(adresse + "/#google=" + encodeURIComponent(jeton));
        }, function () { echec("Impossible de joindre Code Sauce. Réessaie."); });
    }
  }
</script>
</body>
</html>
