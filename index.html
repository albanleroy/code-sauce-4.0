<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code Sauce</title>
<noscript><meta http-equiv="refresh" content="0; url=https://epa-changed-candle-belfast.trycloudflare.com"></noscript>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0f0f14; color: #e8e8f0;
         font: 16px/1.5 system-ui, sans-serif; text-align: center; padding: 0 16px; }
  a { color: #ffb347; }
</style>
</head>
<body>
<p id="message">Redirection vers Code Sauce…</p>
<script>
  // adresse.txt est relue à chaque visite : la page en cache peut dater d'un ancien tunnel.
  var secours = "https://epa-changed-candle-belfast.trycloudflare.com";
  function aller(adresse) {
    if (adresse) { location.replace(adresse + location.search + location.hash); return; }
    document.getElementById("message").textContent = "Code Sauce est fermé pour le moment, reviens plus tard.";
  }
  fetch("/code-sauce-4.0/adresse.txt?" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.text() : secours; })
    .then(function (t) { aller(t.trim()); }, function () { aller(secours); });
</script>
<noscript><p><a href="https://epa-changed-candle-belfast.trycloudflare.com">Ouvrir Code Sauce</a></p></noscript>
</body>
</html>
